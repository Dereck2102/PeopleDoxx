name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio

      - name: Run unit tests
        run: |
          pytest backend/tests/ -v

  build-verification:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Backend Dockerfile
        run: docker build -t peopledoxx-backend ./backend

      - name: Verify Frontend Dockerfile
        run: docker build -t peopledoxx-frontend ./frontend

      - name: Verify Admin Panel Dockerfile
        run: docker build -t peopledoxx-admin ./admin-panel
